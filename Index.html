<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayZone - Online Games</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 32px;
      color: #38bdf8;
    }

    header p {
      margin-top: 8px;
      color: #cbd5e1;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #94a3b8;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #334155;
      text-align: center;
    }

    .game-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .game-card h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .game-card p {
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .play-btn {
      display: inline-block;
      padding: 12px 25px;
      background: #0ea5e9;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .play-btn:hover {
      background: #0284c7;
    }

    .coming {
      opacity: 0.6;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 PlayZone</h1>
    <p>Play. Challenge. Beat the Score.</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome to PlayZone</h2>
      <p>Play fun online games and challenge yourself.</p>
    </section>

    <section class="games">

      <div class="game-card">
