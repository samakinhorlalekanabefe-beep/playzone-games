<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayZone</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    header {
      background: #2563eb;
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
    }

    .container {
      padding: 40px 20px;
    }

    .game {
      max-width: 400px;
      margin: auto;
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
    }

    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #message {
      margin-top: 25px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <header>🎮 PlayZone</header>

  <div class="container">
    <div class="game">
      <h1>Tap Rush</h1>
      <p>Tap the button as many times as you can!</p>

      <h2>Score: <span id="score">0</span></h2>

      <button onclick="tap()">TAP!</button>

      <p id="message">Start playing!</p>
    </div>
  </div>

  <script>
    let score = 0;

    function tap() {
      score++;
      document.getElementById("score").textContent = score;

      if (score >= 10) {
        document.getElementById("message").textContent =
          "🔥 Great job! Keep playing!";
      }
    }
  </script>

</body>
</html>
